<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- r17：viewport-fit=cover（AC-3）——iOS 下 env(safe-area-inset-bottom) 非零的前提；
       缺它刘海/底部条设备 safe-area 避让恒 0 无法验证（TECHNICAL §4.1） -->
  <meta name="description" content="俄罗斯方块（Tetris）简化版 — 自包含静态 Web 应用，双击即玩，零构建、零外部依赖。" />
  <title>TETRIS · 俄罗斯方块</title>
  <!-- 本地样式（AC-08.1：index.html + 本地 css/js，无任何外部引用） -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 背景层：玻璃折射源（DESIGN §2.1） -->
  <div id="page-bg" aria-hidden="true"></div>

  <!-- 页头：霓虹标题 + 四态状态灯（DESIGN §3.1） -->
  <header id="header">
    <h1 id="title">TETRIS</h1>
    <div id="status" role="status" aria-live="polite">
      <span id="status-dot" data-status="ready"></span>
      <span id="status-text">READY</span>
    </div>
  </header>

  <!-- 主区：三列 CSS Grid（240px | 340px | 240px，DESIGN §3.1） -->
  <main id="main">
    <!-- 左信息面板：分数 / 等级 / 行数 / 下一个预览（DESIGN §2.2） -->
    <section id="panel-left" class="panel" aria-label="信息面板">
      <!-- r17：四统计块归一包裹（T1）。.stat-grid = S 档 2×2 HUD 卡的数据来源；
           DOM 顺序恒为 L 档 grid 自动放置基线（禁重排），基座 .stat-grid 复刻
           #panel-left 原 flex gap(20px) 防 L 档快照漂移（AC-7）；后代选择器
           #stat-score .stat__value 等全部仍命中（assembly-check 正例） -->
      <div class="stat-grid" role="group" aria-label="对局统计">
        <div id="stat-score" class="stat">
          <span class="stat__label">分数</span>
          <output id="score" class="stat__value stat__value--score" aria-live="polite">0</output>
        </div>
        <div id="stat-hi" class="stat">
          <span class="stat__label">最高分</span>
          <output id="hi-score" class="stat__value stat__value--score stat__value--hi" aria-live="polite">0</output>
        </div>
        <div id="stat-level" class="stat">
          <span class="stat__label">等级</span>
          <output id="level" class="stat__value stat__value--num" aria-live="polite">1</output>
        </div>
        <div id="stat-lines" class="stat">
          <span class="stat__label">消除行数</span>
          <output id="lines" class="stat__value stat__value--num" aria-live="polite">0</output>
        </div>
      </div>
      <div class="hold-well">
        <span class="stat__label">Hold 暂存</span>
        <canvas id="hold-well" width="48" height="24" aria-label="Hold 暂存方块预览"></canvas>
      </div>
      <div class="next-well">
        <span class="stat__label">下一个</span>
        <canvas id="next-well" width="48" height="80" aria-label="下一个方块预览队列"></canvas>
      </div>
      <!-- v3.0 设置入口（齿轮图标按钮）：点击打开设置弹层（AC-01） -->
      <button type="button" id="btn-settings" class="btn btn--secondary"
              aria-label="打开设置">⚙ 设置</button>
    </section>

    <!-- 游戏板列：唯一逐帧重绘 Canvas；遮罩/toast 为 #board-frame 子节点（覆盖板面，非全页） -->
    <section id="board-col" aria-label="游戏板">
      <div id="board-frame" tabindex="-1">
        <canvas id="board" width="280" height="560" aria-hidden="true"></canvas>
        <!-- 三态遮罩（READY / PAUSED / GAME_OVER，DESIGN §3.2-3.4） -->
        <div id="overlay" hidden>
          <div id="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-sub"></p>
            <button type="button" id="overlay-btn" class="btn btn--primary"></button>
          </div>
        </div>
        <!-- LEVEL UP toast（DESIGN §3.5，AC-06.4） -->
        <div id="feedback-toast" role="status" aria-live="assertive" hidden>LEVEL UP</div>
        <!-- 特殊奖励 toast（Combo / T-Spin，r21 §5.1：与 LEVEL UP 同位并存、独立节点，文案由反馈层写入） -->
        <div id="reward-toast" role="status" aria-live="polite" hidden></div>
      </div>
    </section>

    <!-- 右操作面板：键位图例 + 控制按钮（DESIGN §4.1 / §3.5） -->
    <section id="panel-right" class="panel" aria-label="操作面板">
      <div class="key-hints">
        <div class="key-hints__row"><span>左移 / 右移</span><span><kbd>←</kbd><kbd>→</kbd></span></div>
        <div class="key-hints__row"><span>旋转（顺时针）</span><span><kbd>↑</kbd><kbd>X</kbd></span></div>
        <div class="key-hints__row"><span>软降</span><span><kbd>↓</kbd></span></div>
        <div class="key-hints__row"><span>硬降</span><span><kbd>空格</kbd></span></div>
        <div class="key-hints__row"><span>暂停 / 继续</span><span><kbd>P</kbd><kbd>Esc</kbd></span></div>
        <div class="key-hints__row"><span>重新开始</span><span><kbd>R</kbd></span></div>
        <div class="key-hints__row"><span>开始 / 重开</span><span><kbd>回车</kbd></span></div>
        <div class="key-hints__row"><span>Hold 暂存</span><span><kbd>C</kbd><kbd>Shift</kbd></span></div>
        <div class="key-hints__row"><span>静音 / 取消静音</span><span><kbd>M</kbd></span></div>
      </div>
      <div id="controls">
        <button type="button" id="btn-start" class="btn btn--primary">开始游戏</button>
        <button type="button" id="btn-pause" class="btn btn--secondary" disabled>暂停</button>
        <button type="button" id="btn-restart" class="btn btn--secondary" disabled>重新开始</button>
      </div>
    </section>
  </main>

  <!-- 触屏操控区（r16，AC-1~14）：触屏虚拟按键六键（左/右/旋转/软降/硬降/Hold）。
       契约：data-action 与触屏键映射表 TOUCH_KEYS.action 六值一一对应（verify-ui 交叉断言防漂移）；
       显隐：默认 CSS display:none，仅 html.has-touch（触屏设备）下显示——纯 CSS 显隐不重置对局（AC-1）；
       位置：位于设置弹层之前（createUI 装配期同步查找元素，与设置弹层同一约束） -->
  <div id="touch-controls" class="touchpad" aria-label="触屏操控区">
    <button type="button" class="tkey" data-action="moveLeft" aria-label="左移"><span class="tkey__icon">◀</span><span class="tkey__label">左</span></button>
    <button type="button" class="tkey" data-action="moveRight" aria-label="右移"><span class="tkey__icon">▶</span><span class="tkey__label">右</span></button>
    <button type="button" class="tkey" data-action="rotate" aria-label="旋转"><span class="tkey__icon">⟳</span><span class="tkey__label">旋转</span></button>
    <button type="button" class="tkey" data-action="softDrop" aria-label="软降"><span class="tkey__icon">▼</span><span class="tkey__label">软降</span></button>
    <button type="button" class="tkey" data-action="hardDrop" aria-label="硬降"><span class="tkey__icon">⤓</span><span class="tkey__label">硬降</span></button>
    <button type="button" class="tkey" data-action="hold" aria-label="Hold 暂存"><span class="tkey__icon">📦</span><span class="tkey__label">Hold</span></button>
  </div>

  <!-- v3.0 设置弹层（AC-01~06：齿轮图标触发的毛玻璃风格模态框）。
       注意：必须位于脚本之前——createUI 装配期立即校验全部必需元素（#btn-mute 等），
       若置于脚本之后，真实浏览器解析时同步执行 createUI 会因弹层未入 DOM 而装配失败。 -->
  <div id="settings-modal" class="settings-modal" hidden>
    <div class="settings-modal__backdrop"></div>
    <div class="settings-modal__card" role="dialog" aria-modal="true" aria-label="设置">
      <div class="settings-modal__header">
        <h2 id="settings-modal__title" class="settings-modal__title">设置</h2>
        <button type="button" class="settings-modal__close" aria-label="关闭设置">×</button>
      </div>
      <div class="settings-modal__body">
        <div class="settings-group settings-group--audio">
          <h3 class="settings-group__title">音频设置</h3>
          <div class="settings-group__content">
            <!-- 音量/静音控件区（v2.0，AC-10） -->
            <div id="audio-controls" class="audio-controls" role="group" aria-label="音量控制">
              <span class="stat__label">音量</span>
              <button type="button" id="btn-mute" class="btn btn--secondary btn--audio"
                      aria-pressed="false" aria-label="静音">🔊 静音</button>
              <div class="audio-controls__row">
                <button type="button" id="btn-vol-down" class="btn btn--secondary btn--audio"
                        aria-label="降低音量 10%">−</button>
                <output id="vol-value" class="audio-controls__value" aria-live="polite">80%</output>
                <button type="button" id="btn-vol-up" class="btn btn--secondary btn--audio"
                        aria-label="提高音量 10%">+</button>
              </div>
            </div>
            <!-- BGM 开关（v2.4，AC-14） -->
            <div id="bgm-control" class="ghost-control" role="group" aria-label="背景音乐开关">
              <span class="stat__label">背景音乐</span>
              <button type="button" id="btn-bgm" class="btn btn--secondary btn--audio"
                      aria-pressed="false" aria-label="背景音乐：关闭">🎵 BGM：关</button>
            </div>
          </div>
        </div>
        <div class="settings-group settings-group--assist">
          <h3 class="settings-group__title">辅助设置</h3>
          <div class="settings-group__content">
            <!-- 幽灵块辅助开关（v2.3，AC-13） -->
            <div id="ghost-control" class="ghost-control" role="group" aria-label="幽灵块开关">
              <span class="stat__label">幽灵块</span>
              <button type="button" id="btn-ghost" class="btn btn--secondary btn--audio"
                      aria-pressed="true" aria-label="幽灵块辅助：开启">👻 幽灵块：开</button>
            </div>
            <!-- 踢墙旋转开关（v2.9，AC-19.7） -->
            <div id="wallkick-control" class="ghost-control" role="group" aria-label="踢墙旋转开关">
              <span class="stat__label">踢墙旋转</span>
              <button type="button" id="btn-wallkick" class="btn btn--secondary btn--audio"
                      aria-pressed="true" aria-label="踢墙旋转：开启">🔄 踢墙旋转：开</button>
            </div>
            <!-- Hold 暂存开关（r14，AC-10/11/12） -->
            <div id="hold-control" class="ghost-control" role="group" aria-label="Hold 暂存开关">
              <span class="stat__label">Hold 暂存</span>
              <button type="button" id="btn-hold" class="btn btn--secondary btn--audio"
                      aria-pressed="true" aria-label="Hold 暂存：开启">📦 Hold 暂存：开</button>
            </div>
            <!-- 预览队列开关（r15，AC-6） -->
            <div id="preview-queue-control" class="ghost-control" role="group" aria-label="预览队列开关">
              <span class="stat__label">预览队列</span>
              <button type="button" id="btn-preview-queue" class="btn btn--secondary btn--audio"
                      aria-pressed="true" aria-label="预览队列：开启">👁 预览队列：开</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 本地脚本（顺序：持久化层 → 音效引擎 → 核心逻辑 → UI 层 → 装配根；经典脚本，file:// 安全，AC-08；
       persist.js 为可选依赖，缺席即等效旧版，createUI 不启用持久化，见 TECHNICAL §2.5/v2.6 修订） -->
  <script src="./persist.js"></script>
  <script src="./audio.js"></script>
  <script src="./game.js"></script>
  <script src="./ui.js"></script>
  <script>
    // 装配根（等价 TECHNICAL §3.6 main.ts）：创建游戏与 UI，驱动完整游玩闭环
    // persist 为可选依赖：window.TetrisPersist 缺失（未加载 persist.js）时不传，createUI 内部不启用持久化（向后兼容）
    ;(function () {
      'use strict'
      try {
        var persistHandle = (typeof window !== 'undefined' && window.TetrisPersist)
          ? window.TetrisPersist.createPersistence()
          : undefined
        window.TetrisUI.createUI({ persist: persistHandle })
      } catch (err) {
        console.error('[tetris] 装配失败：', err)
      }
    })()
  </script>
  <noscript>
    <p style="color:#ececf2;text-align:center;padding:1rem">
      本游戏需要启用 JavaScript 才能游玩。
    </p>
  </noscript>
</body>
</html>
