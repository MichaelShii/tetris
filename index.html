<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="俄罗斯方块（Tetris）简化版 — 自包含静态 Web 应用，双击即玩，零构建、零外部依赖。" />
  <title>TETRIS · 俄罗斯方块</title>
  <!-- 本地样式（AC-08.1：index.html + 本地 css/js，无任何外部引用） -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 背景层：玻璃折射源（DESIGN §2.1） -->
  <div id="page-bg" aria-hidden="true"></div>

  <!-- 页头：霓虹标题 + 四态状态灯（DESIGN §3.1） -->
  <header id="header">
    <h1 id="title">TETRIS</h1>
    <div id="status" role="status" aria-live="polite">
      <span id="status-dot" data-status="ready"></span>
      <span id="status-text">READY</span>
    </div>
  </header>

  <!-- 主区：三列 CSS Grid（240px | 340px | 240px，DESIGN §3.1） -->
  <main id="main">
    <!-- 左信息面板：分数 / 等级 / 行数 / 下一个预览（DESIGN §2.2） -->
    <section id="panel-left" class="panel" aria-label="信息面板">
      <div id="stat-score" class="stat">
        <span class="stat__label">分数</span>
        <output id="score" class="stat__value stat__value--score" aria-live="polite">0</output>
      </div>
      <div id="stat-hi" class="stat">
        <span class="stat__label">最高分</span>
        <output id="hi-score" class="stat__value stat__value--score stat__value--hi" aria-live="polite">0</output>
      </div>
      <div id="stat-level" class="stat">
        <span class="stat__label">等级</span>
        <output id="level" class="stat__value stat__value--num" aria-live="polite">1</output>
      </div>
      <div id="stat-lines" class="stat">
        <span class="stat__label">消除行数</span>
        <output id="lines" class="stat__value stat__value--num" aria-live="polite">0</output>
      </div>
      <div class="next-well">
        <span class="stat__label">下一个</span>
        <canvas id="next-well" width="48" height="24" aria-label="下一个方块预览"></canvas>
      </div>
      <!-- 音量/静音控件区（v2.0，AC-10：复用 .btn--secondary/.stat__label token，最小改动） -->
      <div id="audio-controls" class="audio-controls" role="group" aria-label="音量控制">
        <span class="stat__label">音量</span>
        <button type="button" id="btn-mute" class="btn btn--secondary btn--audio"
                aria-pressed="false" aria-label="静音">🔊 静音</button>
        <div class="audio-controls__row">
          <button type="button" id="btn-vol-down" class="btn btn--secondary btn--audio"
                  aria-label="降低音量 10%">−</button>
          <output id="vol-value" class="audio-controls__value" aria-live="polite">80%</output>
          <button type="button" id="btn-vol-up" class="btn btn--secondary btn--audio"
                  aria-label="提高音量 10%">+</button>
        </div>
      </div>
      <!-- 幽灵块辅助开关（v2.3，AC-13：科技玻璃风按钮开关，受样式 .ghost-control 约束） -->
      <div id="ghost-control" class="ghost-control" role="group" aria-label="幽灵块开关">
        <span class="stat__label">幽灵块</span>
        <button type="button" id="btn-ghost" class="btn btn--secondary btn--audio"
                aria-pressed="true" aria-label="幽灵块辅助：开启">👻 幽灵块：开</button>
      </div>
      <!-- BGM 开关（v2.4，AC-14：科技玻璃风按钮开关，默认关，复用 .btn--audio/.stat__label token） -->
      <div id="bgm-control" class="ghost-control" role="group" aria-label="背景音乐开关">
        <span class="stat__label">背景音乐</span>
        <button type="button" id="btn-bgm" class="btn btn--secondary btn--audio"
                aria-pressed="false" aria-label="背景音乐：关闭">🎵 BGM：关</button>
      </div>
    </section>

    <!-- 游戏板列：唯一逐帧重绘 Canvas；遮罩/toast 为 #board-frame 子节点（覆盖板面，非全页） -->
    <section id="board-col" aria-label="游戏板">
      <div id="board-frame" tabindex="-1">
        <canvas id="board" width="280" height="560" aria-hidden="true"></canvas>
        <!-- 三态遮罩（READY / PAUSED / GAME_OVER，DESIGN §3.2-3.4） -->
        <div id="overlay" hidden>
          <div id="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-sub"></p>
            <button type="button" id="overlay-btn" class="btn btn--primary"></button>
          </div>
        </div>
        <!-- LEVEL UP toast（DESIGN §3.5，AC-06.4） -->
        <div id="feedback-toast" role="status" aria-live="assertive" hidden>LEVEL UP</div>
      </div>
    </section>

    <!-- 右操作面板：键位图例 + 控制按钮（DESIGN §4.1 / §3.5） -->
    <section id="panel-right" class="panel" aria-label="操作面板">
      <div class="key-hints">
        <div class="key-hints__row"><span>左移 / 右移</span><span><kbd>←</kbd><kbd>→</kbd></span></div>
        <div class="key-hints__row"><span>旋转（顺时针）</span><span><kbd>↑</kbd><kbd>X</kbd></span></div>
        <div class="key-hints__row"><span>软降</span><span><kbd>↓</kbd></span></div>
        <div class="key-hints__row"><span>硬降</span><span><kbd>空格</kbd></span></div>
        <div class="key-hints__row"><span>暂停 / 继续</span><span><kbd>P</kbd><kbd>Esc</kbd></span></div>
        <div class="key-hints__row"><span>重新开始</span><span><kbd>R</kbd></span></div>
        <div class="key-hints__row"><span>开始 / 重开</span><span><kbd>回车</kbd></span></div>
        <div class="key-hints__row"><span>静音 / 取消静音</span><span><kbd>M</kbd></span></div>
      </div>
      <div id="controls">
        <button type="button" id="btn-start" class="btn btn--primary">开始游戏</button>
        <button type="button" id="btn-pause" class="btn btn--secondary" disabled>暂停</button>
        <button type="button" id="btn-restart" class="btn btn--secondary" disabled>重新开始</button>
      </div>
    </section>
  </main>

  <!-- 本地脚本（顺序：持久化层 → 音效引擎 → 核心逻辑 → UI 层 → 装配根；经典脚本，file:// 安全，AC-08；
       persist.js 为可选依赖，缺席即等效旧版，createUI 不启用持久化，见 TECHNICAL §2.5/v2.6 修订） -->
  <script src="./persist.js"></script>
  <script src="./audio.js"></script>
  <script src="./game.js"></script>
  <script src="./ui.js"></script>
  <script>
    // 装配根（等价 TECHNICAL §3.6 main.ts）：创建游戏与 UI，驱动完整游玩闭环
    // persist 为可选依赖：window.TetrisPersist 缺失（未加载 persist.js）时不传，createUI 内部不启用持久化（向后兼容）
    ;(function () {
      'use strict'
      try {
        var persistHandle = (typeof window !== 'undefined' && window.TetrisPersist)
          ? window.TetrisPersist.createPersistence()
          : undefined
        window.TetrisUI.createUI({ persist: persistHandle })
      } catch (err) {
        console.error('[tetris] 装配失败：', err)
      }
    })()
  </script>
  <noscript>
    <p style="color:#ececf2;text-align:center;padding:1rem">
      本游戏需要启用 JavaScript 才能游玩。
    </p>
  </noscript>
</body>
</html>
