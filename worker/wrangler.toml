# tetris-leaderboard-api — Cloudflare Worker 配置
# 部署：npx wrangler deploy（首次需 npx wrangler login）
# 本地调试：npx wrangler dev（另加 --local 使用本地 KV 模拟）

name = "tetris-leaderboard-api"
main = "src/index.js"
compatibility_date = "2026-09-04"

# KV 命名空间（免费档）：创建后把 id 填入下方占位
# npx wrangler kv namespace create LEADERBOARD
[[kv_namespaces]]
binding = "LEADERBOARD"
id = "REPLACE_WITH_KV_NAMESPACE_ID"